name: CD Action

on:
  workflow_run:
    workflows: ['Docker CI']
    types:
      - completed
    
jobs:

  build:
    env: 
        EC2_HOST: ${{secrets.EC2_HOST}}
        EC2_SSH_KEY: ${{secrets.EC2_SSH_KEY }}
        EC2_USER: ${{secrets.EC2_USER }}
    runs-on: self-hosted

    steps:
    - name: Pull Docker image
      run: echo $EC2_SSH_KEY | ssh -i /dev/stdin $EC2_USER@$EC2_HOST sudo docker pull xsh2047/cinespot:latest
    - name: Remove Stale Containers
      run: echo $EC2_SSH_KEY | ssh -i /dev/stdin $EC2_USER@$EC2_HOST sudo docker rm -f cinespot-container || true
    - name: Run Latest Container
      run: echo $EC2_SSH_KEY | ssh -i /dev/stdin $EC2_USER@$EC2_HOST sudo docker run -d -p 5000:5000 --name cinespot-container xsh2047/cinespot 