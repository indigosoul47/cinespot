name: CD Action

on:
  workflow_run:
    workflows: ['Docker CI']
    types:
      - completed
    
jobs:

  build:
    runs-on: self-hosted
    env: 
      EC2_HOST: ${{secrets.EC2_HOST}}
      EC2_SSH_KEY: ${{secrets.EC2_SSH_KEY }}
      EC2_USER: ${{secrets.EC2_USER }}

    steps:
    - name: Create SSH key
      run: |
        mkdir -p ~/.ssh/
        echo "$EC2_SSH_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        
        # Add the server's public key to known_hosts to avoid the interactive prompt
        ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
        
