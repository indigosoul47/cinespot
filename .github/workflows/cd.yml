name: Docker CD

on:
  workflow_run:
    workflows: ['Docker CI']
    types:
      - completed
    
jobs:

  deploy:
    runs-on: [aws-ec2]

    steps:
    - name: Pull Docker image
      run: sudo docker pull xsh2047/cinespot:latest
    - name: Remove Stale Containers
      run: sudo docker rm -f cinespot-container || true
    - name: Run Latest Container
      run: sudo docker run -d -p 5000:5000 --name cinespot-container xsh2047/cinespot tail -f /dev/null 
    - name: Start App
      run: sudo docker exec -d cinespot-container node index.js