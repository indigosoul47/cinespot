name: Site CD

on:
  workflow_run:
    workflows: ['Site CI']
    types:
      - completed

jobs:

  deploy-site:
    runs-on: [aws-ec2]
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Pull Docker image
        run: sudo docker pull xsh2047/cinespot-app:latest
      - name: Remove Stale Containers
        run: sudo docker rm -f cinespot-app-container || true
      - name: Run Latest Container
        run: sudo docker run -d -p 3000:3000 --name cinespot-app-container xsh2047/cinespot-app tail -f /dev/null 
      - name: Start App
        run: sudo docker exec -d cinespot-app-container node index.js
