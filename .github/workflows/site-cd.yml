name: Site CD

on:
  workflow_run:
    workflows: ['Docker CI']
    types:
      - completed
    
permissions:
  pages: write      # to deploy to Pages
  id-token: write
  contents: read

jobs:

  deploy-site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Dependencies
        run: npm ci
      - name: Build Project
        run: npm run build
      - name: Upload site artifacts
        uses: actions/upload-pages-artifact@v4
        with:
          name: 'react-site'
          path: frontend/build/
      - name: Deploy site artifacts to Github Pages
        uses: actions/deploy-pages@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifact_name: 'react-site'
        
         